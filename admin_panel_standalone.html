<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Biriyani - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #990000 0%, #D4AF37 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .admin-contact {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 6px;
            font-size: 13px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid;
        }

        .stat-card.pending { border-left-color: #FFA500; }
        .stat-card.confirmed { border-left-color: #2196F3; }
        .stat-card.completed { border-left-color: #4CAF50; }
        .stat-card.total { border-left-color: #D4AF37; }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .form-section {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 2px solid #D4AF37;
        }

        .form-section h2 {
            color: #990000;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #990000;
            box-shadow: 0 0 0 2px rgba(153, 0, 0, 0.1);
        }

        .btn-add {
            grid-column: span 1;
            background-color: #990000;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .btn-add:hover {
            background-color: #7a0000;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            background-color: #ddd;
            color: #333;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background-color: #990000;
            color: white;
        }

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-card.pending { border-left-color: #FFA500; }
        .order-card.confirmed { border-left-color: #2196F3; }
        .order-card.completed { border-left-color: #4CAF50; }

        .order-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .order-field {
            display: flex;
            flex-direction: column;
        }

        .order-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .order-value {
            font-size: 14px;
            font-weight: bold;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .order-details.full {
            grid-column: span 2;
        }

        .order-timestamp {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }

        .status-select {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-weight: bold;
            color: #990000;
            cursor: pointer;
        }

        .order-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-whatsapp {
            padding: 10px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.3s;
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
        }

        .btn-admin {
            padding: 10px;
            background-color: #990000;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.3s;
        }

        .btn-admin:hover {
            background-color: #7a0000;
        }

        .empty-state {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            color: #999;
            font-size: 16px;
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .phone-link {
            color: #990000;
            text-decoration: none;
            font-weight: bold;
        }

        .phone-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .order-header, .order-details, .order-actions {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-buttons {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🍛 Royal Biriyani Admin Panel</h1>
            <p>Manage Bulk Orders & Customer Requests</p>
            <div class="admin-contact">
                📱 Admin WhatsApp: <strong>6384945599</strong>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-card confirmed">
                <div class="stat-label">Confirmed</div>
                <div class="stat-value" id="confirmedCount">0</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completedCount">0</div>
            </div>
        </div>

        <!-- Add Order Form -->
        <div class="form-section">
            <h2>➕ Add New Order Manually</h2>
            <form id="addOrderForm" class="form-grid">
                <input type="text" id="name" placeholder="Customer Name" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>
                <input type="date" id="eventDate" required>
                <input type="time" id="eventTime" required>
                <select id="guestCount" required>
                    <option value="">Guest Count</option>
                    <option>50</option>
                    <option>100</option>
                    <option>250</option>
                    <option>500+</option>
                </select>
                <input type="text" id="dishes" placeholder="Dishes/Menu" required>
                <input type="text" id="address" placeholder="Delivery Address" required>
                <button type="submit" class="btn-add">Add Order</button>
            </form>
        </div>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterOrders('all')">All Orders (<span id="allCount">0</span>)</button>
            <button class="filter-btn" onclick="filterOrders('pending')">Pending (<span id="pendingFilterCount">0</span>)</button>
            <button class="filter-btn" onclick="filterOrders('confirmed')">Confirmed (<span id="confirmedFilterCount">0</span>)</button>
            <button class="filter-btn" onclick="filterOrders('completed')">Completed (<span id="completedFilterCount">0</span>)</button>
        </div>

        <!-- Orders List -->
        <div class="orders-container" id="ordersContainer">
            <div class="empty-state">No orders to display</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Royal Biriyani & Fast Food Admin Dashboard | © 2024</p>
            <p style="margin-top: 5px;">For support, contact: <strong>+91 74185 25405</strong></p>
        </div>
    </div>

    <script>
        let orders = JSON.parse(localStorage.getItem('orders')) || [
            {
                id: 1,
                name: 'Rajesh Kumar',
                phone: '9876543210',
                eventDate: '2024-09-15',
                eventTime: '18:00',
                guestCount: '100',
                dishes: 'Biriyani Special, Noodles, Starters',
                address: 'Chennai, Tamil Nadu',
                status: 'pending',
                timestamp: new Date().toLocaleString()
            }
        ];

        const adminPhone = '6384945599';
        let currentFilter = 'all';

        // Update stats
        function updateStats() {
            document.getElementById('totalCount').textContent = orders.length;
            document.getElementById('pendingCount').textContent = orders.filter(o => o.status === 'pending').length;
            document.getElementById('confirmedCount').textContent = orders.filter(o => o.status === 'confirmed').length;
            document.getElementById('completedCount').textContent = orders.filter(o => o.status === 'completed').length;
            
            document.getElementById('allCount').textContent = orders.length;
            document.getElementById('pendingFilterCount').textContent = orders.filter(o => o.status === 'pending').length;
            document.getElementById('confirmedFilterCount').textContent = orders.filter(o => o.status === 'confirmed').length;
            document.getElementById('completedFilterCount').textContent = orders.filter(o => o.status === 'completed').length;
        }

        // Save to localStorage
        function saveOrders() {
            localStorage.setItem('orders', JSON.stringify(orders));
        }

        // Add order
        document.getElementById('addOrderForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const order = {
                id: Math.max(...orders.map(o => o.id), 0) + 1,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                eventDate: document.getElementById('eventDate').value,
                eventTime: document.getElementById('eventTime').value,
                guestCount: document.getElementById('guestCount').value,
                dishes: document.getElementById('dishes').value,
                address: document.getElementById('address').value,
                status: 'pending',
                timestamp: new Date().toLocaleString()
            };
            orders.unshift(order);
            saveOrders();
            document.getElementById('addOrderForm').reset();
            updateDisplay();
        });

        // Filter orders
        function filterOrders(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateDisplay();
        }

        // Update status
        function updateStatus(id, status) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.status = status;
                saveOrders();
                updateStats();
            }
        }

        // WhatsApp to customer
        function sendToCustomer(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                const message = `🎉 Order Confirmation from Royal Biriyani\n\n✅ Order ID: #${order.id}\n👤 Name: ${order.name}\n📅 Event Date: ${order.eventDate}\n🕐 Time: ${order.eventTime}\n👥 Guests: ${order.guestCount}\n🍽️ Menu: ${order.dishes}\n📍 Location: ${order.address}\n\nWe will contact you shortly with pricing & confirmation.`;
                const encodedMsg = encodeURIComponent(message);
                window.open(`https://wa.me/${order.phone}?text=${encodedMsg}`, '_blank');
            }
        }

        // Notify admin
        function notifyAdmin(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                const message = `📋 NEW BULK ORDER RECEIVED\n\n🆔 Order ID: #${order.id}\n👤 Customer: ${order.name}\n📱 Phone: ${order.phone}\n📅 Date: ${order.eventDate}\n🕐 Time: ${order.eventTime}\n👥 Guests: ${order.guestCount}\n🍽️ Menu: ${order.dishes}\n📍 Address: ${order.address}`;
                const encodedMsg = encodeURIComponent(message);
                window.open(`https://wa.me/${adminPhone}?text=${encodedMsg}`, '_blank');
            }
        }

        // Display orders
        function updateDisplay() {
            const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);
            const container = document.getElementById('ordersContainer');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No orders to display</div>';
                return;
            }

            container.innerHTML = filtered.map(order => `
                <div class="order-card ${order.status}">
                    <div class="order-header">
                        <div class="order-field">
                            <div class="order-label">Order ID</div>
                            <div class="order-value" style="color: #990000;">#${order.id}</div>
                        </div>
                        <div class="order-field">
                            <div class="order-label">Status</div>
                            <select class="status-select" onchange="updateStatus(${order.id}, this.value)">
                                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="order-details">
                        <div class="order-field">
                            <div class="order-label">Customer</div>
                            <div class="order-value">${order.name}</div>
                        </div>
                        <div class="order-field">
                            <div class="order-label">Phone</div>
                            <div class="order-value"><a href="tel:${order.phone}" class="phone-link">📱 ${order.phone}</a></div>
                        </div>
                        <div class="order-field">
                            <div class="order-label">Event Date & Time</div>
                            <div class="order-value">${order.eventDate} @ ${order.eventTime}</div>
                        </div>
                        <div class="order-field">
                            <div class="order-label">Guest Count</div>
                            <div class="order-value">👥 ${order.guestCount} Guests</div>
                        </div>
                        <div class="order-field order-details full">
                            <div class="order-label">Menu/Dishes</div>
                            <div class="order-value">${order.dishes}</div>
                        </div>
                        <div class="order-field order-details full">
                            <div class="order-label">Delivery Address</div>
                            <div class="order-value">📍 ${order.address}</div>
                        </div>
                    </div>

                    <div class="order-timestamp">📅 Received: ${order.timestamp}</div>

                    <div class="order-actions">
                        <button class="btn-whatsapp" onclick="sendToCustomer(${order.id})">💬 Send to Customer</button>
                        <button class="btn-admin" onclick="notifyAdmin(${order.id})">📢 Notify Admin (${adminPhone})</button>
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        // Initial display
        updateDisplay();
    </script>
</body>
</html>
